<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0f1216"/>

  <!-- badge -->
  <circle cx="512" cy="512" r="330" fill="#e6e4e1" stroke="#3a3d42" stroke-width="2"/>

  <!-- monogram: w with underline, s with overline -->
  <g transform="translate(-21,88) scale(1.22)" transform-origin="512 420"
     fill="#111111" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800">
    <text x="452" y="452" font-size="150" text-anchor="middle">w</text>
    <rect x="388" y="476" width="128" height="20" rx="2"/>

    <rect x="542" y="358" width="128" height="20" rx="2"/>
    <text x="606" y="482" font-size="150" text-anchor="middle">s</text>
  </g>
</svg>
