<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Warkopsaja — Input Harian</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <meta name="description" content="Input & rekap kas harian warung kopi"/>

  <!-- Dipasang di layar utama HP: ikon, nama, warna splash. Lihat
       public/manifest.webmanifest — berkas yang sama juga dibaca Bubblewrap
       saat membungkus APK, jadi ikon app Android ikut dari sana. -->
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#F5F5F7"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Warkopsaja"/>
  <!-- Font Inter + JetBrains Mono di-bundle lewat @fontsource (lihat src/main.jsx),
       jadi tidak ada permintaan ke fonts.googleapis.com saat app dibuka. -->
  <script>
    // Tema dipasang SEBELUM React jalan. Tanpa ini ada satu frame bertema gelap
    // (nilai :root di CSS) sebelum useEffect menyetelnya ke terang — kelihatan
    // seperti kedipan tiap app dibuka.
    (function () {
      var tema = 'light';
      try { tema = localStorage.getItem('theme') || 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', tema);
      // Bilah status HP ikut warna app, bukan putih sendirian di atas layar
      // gelap. Disetel di sini juga (bukan cuma di useTheme) supaya tidak ada
      // satu frame salah warna saat app dibuka dari layar utama.
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', tema === 'dark' ? '#121110' : '#F5F5F7');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
