                  </div>
                  {(() => {
                    const v = voucherForDate(selectedDate, voucherToko);
                    const hasVoucher = v.laku>0 || v.drop>0;
                    if (!existingEntry && !hasVoucher) return null;
                    const exItems = (existingEntry?.expenses||[]).filter(x=>x.type!=='cashin');
                    const cashItems = (existingEntry?.expenses||[]).filter(x=>x.type==='cashin');
                    const exGross = exItems.reduce((s,x)=>s+(x.amount||0),0);
                    const cashGross = cashItems.reduce((s,x)=>s+(x.amount||0),0);
                    const items = existingEntry ? PRODUCTS.filter(p=>(existingEntry.quantities?.[p.id]||0)>0).map(p=>p.name+' ×'+existingEntry.quantities[p.id]).join(', ') : '';
                    const totalPenj = (existingEntry?.totalPenjualan||0) + v.penjualan;
                    const totalGaji = (existingEntry?.gaji||0) + v.gaji;
                    return (
                      <div className="day-total">
                        📦 Sudah tercatat: <strong>{items || (hasVoucher ? '(hanya voucher)' : '–')}</strong><br/>
                        {hasVoucher && <>📶 Voucher: <strong>laku ×{v.laku}{v.drop>0&&', drop '+v.drop}</strong> <span style={{fontSize:11,color:"var(--text3)"}}>(dari menu Voucher Toko)</span><br/></>}
                        💰 Penjualan: <strong>{IDR(totalPenj)}</strong> · Gaji: <strong>{IDR(totalGaji)}</strong><br/>
                        {existingEntry && <>💸 Pengeluaran: <strong>{IDR(exGross)}</strong> ({exItems.length} item){cashGross>0 && <> · 💵 Hutang Dibayar: <strong style={{color:"var(--green)"}}>{IDR(cashGross)}</strong> ({cashItems.length} item)</>}<br/></>}
                        <span style={{fontSize:11,color:"var(--text3)"}}>Input baru akan ditambahkan ke data di atas</span>
                      </div>
                    );
                  })()}
                </div>

                <div className="card">
                  <div className="card-title">☕ Jumlah Laku</div>
                  {PRODUCTS.filter(p => !(p.id==='v2k' && selectedDate >= VOUCHER_TOKO_CUTOFF)).map(p => (
                    <div key={p.id} className="product-row">
                      <div className="product-emoji">{p.emoji}</div>
                      <div className="product-info">
                        <div className="product-name">{p.name}</div>
                        <div className="product-meta">{IDR(p.price)} · Gaji: {IDR(p.gaji)}</div>
                      </div>
                      <div className="qty-control">
                        <button className="qty-btn" onClick={()=>changeQty(p.id,-1)}>−</button>
                        <input className="qty-display" type="number" min="0" value={quantities[p.id]} onChange={e=>setQty(p.id,e.target.value)}/>
                        <button className="qty-btn" onClick={()=>changeQty(p.id,1)}>+</button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="card">
                  <div className="card-title">📊 Ringkasan</div>
                  <div className="summary-grid">
                    <div className="summary-item"><div className="summary-label">Total Laku</div><div className="summary-value">{inputTotals.totalQty} item</div></div>
                    <div className="summary-item"><div className="summary-label">Penjualan</div><div className="summary-value">{IDR(inputTotals.totalSales)}</div></div>
                    <div className="summary-item gaji-box"><div className="summary-label">💰 Gaji Kamu Hari Ini</div><div className="summary-value">{IDR(inputTotals.totalGaji)}</div></div>
                    <div className="summary-item outbox"><div className="summary-label">Pengeluaran</div><div className="summary-value">{IDR(inputTotals.totalExpense)}</div></div>
                    {inputTotals.totalCashIn>0 && <div className="summary-item" style={{background:"var(--green-bg)",borderColor:"var(--green-border)"}}><div className="summary-label">💵 Hutang Dibayar</div><div className="summary-value" style={{color:"var(--green)"}}>{IDR(inputTotals.totalCashIn)}</div></div>}
                    <div className="summary-item kas-box"><div className="summary-label">{inputTotals.sisaKas>0?'Untung Hari Ini':inputTotals.sisaKas<0?'Rugi Hari Ini':'Impas'}</div><div className="summary-value" style={{color:inputTotals.sisaKas<0?"var(--red)":"var(--green)"}}>{IDR(inputTotals.sisaKas)}</div></div>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title">💸 Pengeluaran</div>
                  {expenses.map((exp, i) => (
                    <div key={i} className="expense-row">
                      <input className="expense-input" type="text" placeholder="Keterangan…" value={exp.desc} onChange={e=>updateExpense(i,'desc',e.target.value)}/>
                      <input className="expense-amount" type="number" placeholder="Jumlah" value={exp.amount||''} onChange={e=>updateExpense(i,'amount',e.target.value)}/>
                      <button className="del-btn" onClick={()=>removeExpense(i)}>×</button>
                    </div>
                  ))}
                  <button className="add-expense-btn" onClick={addExpense}>+ Tambah Pengeluaran</button>
                </div>

                <div className="card">
                  <div className="card-title">💵 Hutang Dibayar</div>
                  <div style={{fontSize:12,color:"var(--text3)",marginTop:-6,marginBottom:12}}>Catat pelanggan yang bayar hutangnya. Akan menambah kas tanpa menambah gaji.</div>
                  {cashIns.map((exp, i) => (
                    <div key={i} className="expense-row">
                      <input className="expense-input" type="text" placeholder="Cth: Pak Budi bayar hutang…" value={exp.desc} onChange={e=>updateCashIn(i,'desc',e.target.value)}/>
                      <input className="expense-amount" type="number" placeholder="Jumlah" value={exp.amount||''} onChange={e=>updateCashIn(i,'amount',e.target.value)}/>
                      <button className="del-btn" onClick={()=>removeCashIn(i)}>×</button>
                    </div>
                  ))}
                  <button className="add-expense-btn" onClick={addCashIn}>+ Tambah Hutang Dibayar</button>
                </div>

                <button className="btn-save" disabled={saving} onClick={saveEntry}>☕ Tambah & Simpan</button>
              </>}

              {page==="voucher" && <>
                <h1 className="page-title">📶 Voucher Toko</h1>
                <p className="page-sub">Drop = stok dititipkan ke toko · Laku = laporan setoran toko. Harga jual {IDR(V2K.price)}/voucher — toko ambil komisi {IDR(V2K.komisi_toko)}, setor ke kas {IDR(V2K_SETORAN)}. Gaji Jaya = laku × {IDR(V2K.gaji)}.</p>

                <div className="card">
                  <div className="card-title">📅 Tanggal</div>
                  <div className="date-row">
                    <input type="date" className="date-input" min={VOUCHER_TOKO_CUTOFF} value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}/>
                  </div>
                  {selectedDate < VOUCHER_TOKO_CUTOFF && (
                    <div className="day-total" style={{background:"var(--orange-bg)",borderColor:"var(--orange-border)",color:"var(--orange)"}}>
                      ⚠️ Voucher Toko hanya berlaku mulai 1 Mei 2026. Pilih tanggal 1 Mei 2026 atau setelahnya.
                    </div>
                  )}
                </div>

                {selectedDate >= VOUCHER_TOKO_CUTOFF && (() => {
                  const stockBefore = voucherStockBefore(selectedDate, voucherToko);
                  let dayDrop=0, dayLaku=0;
                  TOKO.forEach(t => { const d = voucherDraft[t.id]||{drop:'0',laku:'0'}; dayDrop += parseInt(d.drop)||0; dayLaku += parseInt(d.laku)||0; });
                  return (
                    <>
                      <div className="card">
                        <div className="card-title">📊 Ringkasan Hari Ini</div>
                        <div className="summary-grid">
                          <div className="summary-item"><div className="summary-label">Total Drop</div><div className="summary-value" style={{color:"var(--blue)"}}>{dayDrop}</div></div>
                          <div className="summary-item"><div className="summary-label">Total Laku</div><div className="summary-value" style={{color:"var(--green)"}}>{dayLaku}</div></div>
                          <div className="summary-item gaji-box"><div className="summary-label">💰 Gaji Jaya Hari Ini</div><div className="summary-value">{IDR(dayLaku*V2K.gaji)}</div></div>
                          <div className="summary-item kas-box"><div className="summary-label">💵 Setoran ke Kas</div><div className="summary-value" style={{color:"var(--green)"}}>{IDR(dayLaku*V2K_SETORAN)}</div><div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>kotor {IDR(dayLaku*V2K.price)} − komisi toko {IDR(dayLaku*V2K.komisi_toko)}</div></div>
                        </div>
                      </div>

                      {TOKO.map(t => {
                        const sBefore = stockBefore[t.id];
                        const stokAwal = (sBefore.drop||0) - (sBefore.laku||0);
                        const draft = voucherDraft[t.id] || { drop:'0', laku:'0' };
                        const dDrop = parseInt(draft.drop)||0;
                        const dLaku = parseInt(draft.laku)||0;
                        const stokAkhir = stokAwal + dDrop - dLaku;
                        const overLaku = dLaku > (stokAwal + dDrop);
                        return (
                          <div key={t.id} className="card">
                            <div className="card-title">{t.emoji} {t.name}</div>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
                              <div className="gajian-stat"><div className="gajian-stat-label">Stok Awal</div><div className="gajian-stat-value" style={{color: stokAwal<0?"var(--red)":"var(--text)"}}>{stokAwal}</div></div>
                              <div className="gajian-stat" style={{background:"var(--blue-bg)"}}><div className="gajian-stat-label">+ Drop</div><div className="gajian-stat-value" style={{color:"var(--blue)"}}>{dDrop}</div></div>
                              <div className="gajian-stat" style={{background:"var(--green-bg)",borderColor:"var(--green-border)"}}><div className="gajian-stat-label">− Laku</div><div className="gajian-stat-value" style={{color:"var(--green)"}}>{dLaku}</div></div>
                            </div>
                            <div className="expense-row" style={{marginBottom:8}}>
                              <input className="expense-input" type="text" value="Drop hari ini (titip ke toko)" readOnly style={{cursor:"default",background:"var(--bg3)"}}/>
                              <input className="expense-amount" type="number" min="0" placeholder="0" value={draft.drop} onChange={e=>setDraft(t.id,'drop',e.target.value)}/>
                            </div>
                            <div className="expense-row">
                              <input className="expense-input" type="text" value="Laku hari ini (setoran toko)" readOnly style={{cursor:"default",background:"var(--bg3)"}}/>
                              <input className="expense-amount" type="number" min="0" placeholder="0" value={draft.laku} onChange={e=>setDraft(t.id,'laku',e.target.value)}/>

                              <span style={{color:overLaku?"var(--red)":"var(--text2)"}}>
                                {overLaku ? '⚠️ Laku melebihi stok!' : 'Stok akhir hari ini'}
                              </span>
                              <strong style={{fontFamily:"'Space Mono',monospace",color:stokAkhir<0?"var(--red)":"var(--text)"}}>{stokAkhir}</strong>
                            </div>
                            <div style={{marginTop:8,display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--text3)",flexWrap:"wrap",gap:6}}>
                              <span>Setoran toko: <strong style={{color:"var(--green)"}}>{IDR(dLaku*V2K_SETORAN)}</strong> <span style={{color:"var(--text3)"}}>(komisi {IDR(dLaku*V2K.komisi_toko)})</span></span>
                              <span>Gaji Jaya: <strong style={{color:"var(--accent)"}}>{IDR(dLaku*V2K.gaji)}</strong></span>
                            </div>
                          </div>
                        );
                      })}

                      <button className="btn-save" disabled={voucherSaving} onClick={saveVoucherTokoDay}>
                        {voucherSaving ? 'Menyimpan…' : '📶 Simpan Voucher Hari Ini'}
                      </button>

                      {/* Rekap periode berjalan */}
                      {(() => {
                        const today = new Date(); const y = today.getFullYear(); const m = today.getMonth();
                        const periods = getPayPeriods(y, m);
                        const sd = new Date(selectedDate+'T00:00:00');
                        const sy = sd.getFullYear(), sm = sd.getMonth(), sday = sd.getDate();
                        const periodsForSelected = getPayPeriods(sy, sm);
                        const p = sday<=14 ? periodsForSelected[0] : periodsForSelected[1];
                        const range = voucherInRange(p.start, p.end, voucherToko);
                        return (
                          <div className="card" style={{marginTop:24}}>
                            <div className="card-title">📅 Rekap Periode {ML[sm]} · {p.label} (tgl {p.startDay}–{p.endDay})</div>
                            <div className="summary-grid">
                              <div className="summary-item"><div className="summary-label">Total Drop</div><div className="summary-value" style={{color:"var(--blue)"}}>{range.drop}</div></div>
                              <div className="summary-item"><div className="summary-label">Total Laku</div><div className="summary-value" style={{color:"var(--green)"}}>{range.laku}</div></div>
                              <div className="summary-item gaji-box"><div className="summary-label">💰 Gaji Jaya Periode</div><div className="summary-value">{IDR(range.gaji)}</div></div>
                              <div className="summary-item kas-box"><div className="summary-label">💵 Penjualan Periode</div><div className="summary-value" style={{color:"var(--green)"}}>{IDR(range.penjualan)}</div></div>
                            </div>
                            <div style={{marginTop:14,fontSize:11,color:"var(--text3)"}}>
                              Sisa stok di toko (drop − laku, kumulatif sampai {fmtDate(p.end)}):
                            </div>
                            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginTop:8}}>
                              {(() => {
                                const stokEnd = voucherStockPerToko(p.end, voucherToko);
                                return TOKO.map(t => {
                                  const s = stokEnd[t.id]; const sisa = (s.drop||0) - (s.laku||0);
                                  return (
                                    <div key={t.id} className="gajian-stat">
                                      <div className="gajian-stat-label">{t.emoji} {t.name}</div>
                                      <div className="gajian-stat-value" style={{color:sisa<0?"var(--red)":"var(--text)"}}>{sisa}</div>
                                    </div>
                                  );
                                });
                              })()}
                            </div>
                          </div>
                        );
                      })()}
                    </>
                  );
                })()}
              </>}

              {page==="gajian" && <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
                  <div><h1 className="page-title">Rekap Gajian</h1><p className="page-sub" style={{marginBottom:0}}>Gaji per periode — tanggal 1–14 dan 15–28 tiap bulan</p></div>
                  <button className="btn-export" onClick={()=>exportGajianCSV(entries, periodSaldoMap, initialSaldo, voucherToko)}><Icon type="download" size={15}/> Export CSV</button>
                </div>
                <div style={{marginBottom:28}}></div>

                {/* Saldo Awal Setting */}
                <div className="card" style={{marginBottom:20}}>
                  <div className="card-title">💰 Saldo Awal</div>
                  {editingSaldo ? (
                    <div style={{display:"flex",gap:8,alignItems:"center"}}>
                      <input className="expense-amount" style={{flex:1,width:"auto",textAlign:"left"}} type="number" autoFocus placeholder="Masukkan saldo awal..." value={saldoInput} onChange={e=>setSaldoInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveInitialSaldo(saldoInput)}}/>
                      <button className="btn btn-primary" onClick={()=>saveInitialSaldo(saldoInput)}>Simpan</button>
                      <button className="btn btn-ghost" onClick={()=>setEditingSaldo(false)}>Batal</button>
                    </div>
                  ) : (
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:20,fontWeight:700,color:"var(--accent)"}}>{IDR(initialSaldo)}</div>
                      <button className="btn btn-ghost btn-sm" onClick={()=>{setSaldoInput(String(initialSaldo));setEditingSaldo(true);}}>✏️ Ubah</button>
                      <div style={{fontSize:11,color:"var(--text3)",marginLeft:4}}>Saldo ini akan terakumulasi ke setiap periode berikutnya</div>
                    </div>
                  )}
                </div>

                {(()=>{
                  const currentMonth = today.getMonth(); const currentYear = today.getFullYear(); const currentDay = today.getDate();
                  const monthsToShow = [{ year:currentYear, month:currentMonth }, currentMonth===0?{year:currentYear-1,month:11}:{year:currentYear,month:currentMonth-1}];
                  return monthsToShow.map(({year, month}) => {
                    const periods = getPayPeriods(year, month);
                    const isCurrentMonth = (year===currentYear && month===currentMonth);
                    const monthLabel = ML[month]+' '+year;
                    // Newest period first; sembunyikan periode yang belum mulai
                    const indexed = periods.map((p,pi) => ({p,pi}));
                    const ordered = indexed.slice().reverse().filter(({p}) => !(isCurrentMonth && currentDay < p.startDay));
                    return ordered.map(({p,pi}) => {
                      const mainEntries = Object.values(entries).filter(e=>e.date>=p.start&&e.date<=p.end);
                      const overflowEntries = (p.overflowStart&&p.overflowEnd) ? Object.values(entries).filter(e=>e.date>=p.overflowStart&&e.date<=p.overflowEnd) : [];
                      const periodEntries = [...overflowEntries, ...mainEntries];
                      const eGaji = periodEntries.reduce((s,e)=>s+(e.gaji||0),0);
                      const ePenjualan = periodEntries.reduce((s,e)=>s+(e.totalPenjualan||0),0);
                      const totalPengeluaran = periodEntries.reduce((s,e)=>s+(e.totalPengeluaran||0),0);
                      const vMain = voucherInRange(p.start, p.end, voucherToko);
                      const vOver = (p.overflowStart&&p.overflowEnd) ? voucherInRange(p.overflowStart, p.overflowEnd, voucherToko) : { gaji:0, penjualan:0, laku:0, drop:0 };
                      const totalGaji = eGaji + vMain.gaji + vOver.gaji;
                      const totalPenjualan = ePenjualan + vMain.penjualan + vOver.penjualan;
                      const periodKey = year+'-'+month+'-'+pi;
                      const saldoAwal = periodSaldoMap[periodKey] || 0;
                      const totalSisaKas = totalPenjualan - totalGaji - totalPengeluaran;
                      const sisaKasDenganSaldo = totalSisaKas + saldoAwal;
                      // Hitung hari kerja: gabungan tanggal dari entries + voucher_toko (yang punya laku/drop)
                      const periodDateSet = new Set(periodEntries.map(e=>e.date));
                      Object.keys(voucherToko||{}).forEach(d => {
                        if ((d>=p.start && d<=p.end) || (p.overflowStart && d>=p.overflowStart && d<=p.overflowEnd)) {
                          const v = voucherForDate(d, voucherToko); if (v.laku>0 || v.drop>0) periodDateSet.add(d);
                        }
                      });
                      const totalDays = periodDateSet.size;
                      const isPast = !isCurrentMonth || (isCurrentMonth && currentDay > p.payday);
                      const isCurrent = isCurrentMonth && ((p.payday===14 && currentDay>=1 && currentDay<=14) || (p.payday===28 && currentDay>=15 && currentDay<=28));
                      let statusClass, statusText;
                      if (isPast && !isCurrent) { statusClass='paid'; statusText='Selesai'; }
                      else if (isCurrent) { statusClass='pending'; statusText='Berjalan'; }
                      else { statusClass='future'; statusText='Belum'; }
                      const overflowLabel = overflowEntries.length>0 ? ' (+tgl '+p.overflowDays[0]+'–'+p.overflowDays[p.overflowDays.length-1]+' '+MO[p.prevMonth]+')' : '';

                      return (
                        <div key={year+'-'+month+'-'+pi} className={"gajian-card"+(isCurrent?" active-period":"")}>
                          <div className="gajian-header">
                            <div>
                              <div className="gajian-period-label">{monthLabel} · {p.label}</div>
                              <div className="gajian-period-dates">Tgl {p.startDay}–{p.endDay}{overflowLabel} · Gajian tgl {p.payday} · {totalDays} hari kerja</div>
                            </div>
                            <div className="gajian-total-box">
                              <div className="gajian-total-label">Total Gaji</div>
                              <div className="gajian-total-value"><AnimatedIDR value={totalGaji}/></div>
                              <span className={"gajian-status-badge "+statusClass}>{statusText}</span>
                            </div>
                          </div>
                          <div className="gajian-stats">
                            <div className="gajian-stat"><div className="gajian-stat-label">Pemasukan</div><div className="gajian-stat-value" style={{color:"var(--text)"}}>{IDR(totalPenjualan)}</div></div>
                            <div className="gajian-stat" style={{background:"var(--red-bg)",borderColor:"var(--red-border)"}}><div className="gajian-stat-label">Pengeluaran</div><div className="gajian-stat-value" style={{color:"var(--red)"}}>{IDR(totalPengeluaran)}</div></div>
                            <div className="gajian-stat" style={{background:"var(--accent-bg)",borderColor:"var(--accent-border)"}}><div className="gajian-stat-label">Awal Periode</div><div className="gajian-stat-value" style={{color:"var(--accent)"}}>{IDR(saldoAwal)}</div></div>
                          </div>
                          <div className="gajian-stats2">
                            <div className="gajian-stat" style={{background:"var(--green-bg)",borderColor:"var(--green-border)"}}><div className="gajian-stat-label">Kas di Akhir</div><div className="gajian-stat-value" style={{color:sisaKasDenganSaldo<0?"var(--red)":"var(--green)",fontSize:16}}><AnimatedIDR value={sisaKasDenganSaldo}/></div></div>
                            <div className="gajian-stat"><div className="gajian-stat-label">Bersih Periode</div><div className="gajian-stat-value" style={{color:totalSisaKas<0?"var(--red)":"var(--text)"}}><AnimatedIDR value={totalSisaKas}/></div></div>
                          </div>

                          {overflowEntries.length>0 && (
                            <div style={{borderBottom:"1px dashed var(--border)",marginBottom:4,paddingBottom:4}}>
                              <div style={{fontSize:10,fontWeight:700,color:"var(--orange)",letterSpacing:".06em",textTransform:"uppercase",padding:"4px 0 6px"}}>⬆ Limpahan bulan {ML[p.prevMonth]}</div>
                              {p.overflowDays.map(d => {
                                const dd = String(d).padStart(2,'0');
                                const dateStr = p.prevYear+'-'+String(p.prevMonth+1).padStart(2,'0')+'-'+dd;
                                const entry = entries[dateStr]; const dt = new Date(dateStr+'T00:00:00'); const dayName = DAYS[dt.getDay()];
                                const v = voucherForDate(dateStr, voucherToko);
                                if (!(entry || v.laku>0 || v.drop>0)) return null;
                                const soldProducts = entry ? PRODUCTS.filter(pr=>(entry.quantities?.[pr.id]||0)>0) : [];
                                const dayExp = entry?.totalPengeluaran||0;
                                const totalDayGaji = (entry?.gaji||0) + v.gaji;
                                return (
                                  <div key={dateStr} className="gajian-day-row" style={{background:"rgba(251,146,60,.04)"}}>
                                    <div className="gajian-day-left">
                                      <div className="gajian-day-date">{d} {MO[p.prevMonth]} <span className="day-name">{dayName}</span></div>
                                      <div className="gajian-day-chips">
                                        {soldProducts.map(pr => <span key={pr.id} className="gajian-day-chip">{pr.emoji} {pr.name} ×{entry.quantities[pr.id]}</span>)}
                                        {v.laku>0 && <span className="gajian-day-chip voucher">🏪 Voucher Toko ×{v.laku}</span>}
                                        {v.drop>0 && <span className="gajian-day-chip drop">📦 Drop {v.drop}</span>}
                                        {dayExp>0 && <span className="gajian-day-chip exp">−{IDR(dayExp)}</span>}
                                      </div>
                                    </div>
                                    <div className="gajian-day-amount">{IDR(totalDayGaji)}</div>
                                  </div>
                                );
                              })}
                            </div>
                          )}

                          {(() => {
                            const days = Array.from({length:p.endDay-p.startDay+1},(_,i)=>p.startDay+i);
                            const rows = days.map(d => {
                              const dd = String(d).padStart(2,'0');
                              const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+dd;
                              const entry = entries[dateStr]; const dt = new Date(dateStr+'T00:00:00'); const dayName = DAYS[dt.getDay()];
                              const v = voucherForDate(dateStr, voucherToko);
                              if (!(entry || v.laku>0 || v.drop>0)) return null;
                              const soldProducts = entry ? PRODUCTS.filter(pr=>(entry.quantities?.[pr.id]||0)>0) : [];
                              const dayExp = entry?.totalPengeluaran||0;
                              const totalDayGaji = (entry?.gaji||0) + v.gaji;
                              return (
                                <div key={dateStr} className="gajian-day-row">
                                  <div className="gajian-day-left">
                                    <div className="gajian-day-date">{d} {MO[month]} <span className="day-name">{dayName}</span></div>
                                    <div className="gajian-day-chips">
                                      {soldProducts.map(pr => <span key={pr.id} className="gajian-day-chip">{pr.emoji} {pr.name} ×{entry.quantities[pr.id]}</span>)}
                                      {v.laku>0 && <span className="gajian-day-chip voucher">🏪 Voucher Toko ×{v.laku}</span>}
                                      {v.drop>0 && <span className="gajian-day-chip drop">📦 Drop {v.drop}</span>}
                                      {dayExp>0 && <span className="gajian-day-chip exp">−{IDR(dayExp)}</span>}
                                    </div>
                                  </div>
                                  <div className="gajian-day-amount">{IDR(totalDayGaji)}</div>
                                </div>
                              );
                            }).filter(Boolean);
                            if (rows.length === 0) return <div className="gajian-empty-state">Belum ada input di periode ini</div>;
                            return <>
                              {rows}
                              {rows.length < days.length && <div className="gajian-period-note">{rows.length} dari {days.length} hari tercatat</div>}
                            </>;
                          })()}
                        </div>
                      );
                    });
                  });
                })()}
              </>}

              {page==="riwayat" && <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
                  <div><h1 className="page-title">Riwayat</h1><p className="page-sub" style={{marginBottom:0}}>Data penjualan yang sudah tersimpan</p></div>
                  {sortedEntries.length>0 && <button className="btn-export" onClick={()=>exportRiwayatCSV(entries, voucherToko)}><Icon type="download" size={15}/> Export CSV</button>}
                </div>
                <div style={{marginBottom:20}}></div>
                {sortedEntries.length>0 && (
                  <div className="search-wrap">
                    <span className="search-icon">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    </span>
                    <input
                      className="search-input"
                      type="text"
                      placeholder="Cari tanggal, hari, produk, atau pengeluaran…"
                      value={searchQuery}
                      onChange={e=>setSearchQuery(e.target.value)}
                    />
                    {searchQuery && <button className="search-clear" onClick={()=>setSearchQuery('')} title="Hapus">×</button>}
                  </div>
                )}
                {searchQuery && (
                  <div className="search-meta">
                    {filteredEntries.length} dari {sortedEntries.length} entri cocok dengan "{searchQuery}"
                  </div>
                )}
                {sortedEntries.length===0 ? (
                  <div className="empty"><div className="empty-icon">📋</div>Belum ada data tersimpan.<br/>Mulai input di tab "Input Harian".</div>
                ) : filteredEntries.length===0 ? (
                  <div className="empty"><div className="empty-icon">🔍</div>Tidak ada entri yang cocok.<br/>Coba kata kunci lain atau hapus pencarian.</div>
                ) : filteredEntries.map((e, i) => {
                  const sold = PRODUCTS.filter(p=>(e.quantities?.[p.id]||0)>0);
                  const expItems = (e.expenses||[]).filter(x=>x.type!=='cashin');
                  const cashItems = (e.expenses||[]).filter(x=>x.type==='cashin');
                  const expGross = expItems.reduce((s,x)=>s+(x.amount||0),0);
                  const cashGross = cashItems.reduce((s,x)=>s+(x.amount||0),0);
                  const totalExp = e.totalPengeluaran!=null ? e.totalPengeluaran : (expGross - cashGross);
                  const v = voucherForDate(e.date, voucherToko);
                  const totalGajiRow = (e.gaji||0) + v.gaji;
                  const totalPenjualanRow = (e.totalPenjualan||0) + v.penjualan;
                  const sisaKas = totalPenjualanRow - totalGajiRow - totalExp;
                  const hasVoucher = v.laku>0 || v.drop>0;
                  const tokoBreakdown = hasVoucher ? TOKO.map(t => {
                    const r = (voucherToko[e.date]||{})[t.id]; if (!r || (!r.drop && !r.laku)) return null;
                    return { id:t.id, name:t.name, emoji:t.emoji, drop:r.drop||0, laku:r.laku||0 };
                  }).filter(Boolean) : [];
                  const isOpen = openDetail===i;
                  const kasClass = sisaKas>0?'profit':sisaKas<0?'loss':'';
                  const sisaSign = sisaKas>0?'pos':sisaKas<0?'neg':'';
                  const sisaLabel = sisaKas>0?'Untung':sisaKas<0?'Rugi':'Impas';
                  return (
                    <div key={e.date} className={"history-item "+kasClass} onClick={()=>setOpenDetail(isOpen?null:i)}>
                      <div className="history-item-header">
                        <span className="history-date">{fmtDate(e.date)}</span>
                        <div className="history-amount">
                          <span className="history-amount-label">{sisaLabel}</span>
                          <span className={"history-gaji "+sisaSign}>{IDR(sisaKas)}</span>
                        </div>
                      </div>
                      <div className="history-pills">
                        {sold.length>0 ? sold.map(p=><span key={p.id} className="pill">{p.emoji} {p.name} ×{e.quantities[p.id]}</span>) : (!hasVoucher && <span className="pill" style={{color:"var(--text3)"}}>–</span>)}
                        {v.laku>0 && <span className="pill" style={{background:"var(--accent-bg)",color:"var(--accent)",borderColor:"var(--accent-border)"}}>📶 Voucher ×{v.laku}</span>}
                        {v.drop>0 && <span className="pill" style={{background:"var(--blue-bg)",color:"var(--blue)"}}>📦 Drop {v.drop}</span>}
                        {expGross>0 && <span className="pill" style={{background:"var(--red-bg)",color:"var(--red)",borderColor:"var(--red-border)"}}>-{IDR(expGross)}</span>}
                        {cashGross>0 && <span className="pill" style={{background:"var(--green-bg)",color:"var(--green)",borderColor:"var(--green-border)"}}>+{IDR(cashGross)} cash</span>}
                      </div>
                      {isOpen && (
                        <div className="history-detail">
                          <div className="history-summary">
                            <div className="summary-row add"><span className="summary-label">Pemasukan</span><span className="summary-value">{IDR(totalPenjualanRow)}</span></div>
                            <div className="summary-row sub"><span className="summary-label">Gaji</span><span className="summary-value">−{IDR(totalGajiRow)}</span></div>
                            {expGross>0 && <div className="summary-row sub"><span className="summary-label">Pengeluaran</span><span className="summary-value">−{IDR(expGross)}</span></div>}
                            {cashGross>0 && <div className="summary-row cash"><span className="summary-label">Hutang Dibayar</span><span className="summary-value">+{IDR(cashGross)}</span></div>}
                            <div className="summary-row total">
                              <span className="summary-label">{sisaLabel} Hari Ini</span>
                              <span className={"summary-value "+sisaSign}>{IDR(sisaKas)}</span>
                            </div>
                          </div>
                          {(sold.length>0 || tokoBreakdown.length>0) && <>
                            <div className="detail-section-label">Rincian Gaji</div>
                            {sold.map(p=>(<div key={p.id} className="detail-row"><span className="detail-item-name">{p.emoji} {p.name} ×{e.quantities[p.id]}</span><span className="detail-item-value">{IDR(e.quantities[p.id]*p.gaji)}</span></div>))}
                            {tokoBreakdown.map(t => {
                              const hasLaku = t.laku>0, hasDrop = t.drop>0;
                              let dropNote = '';
                              if (hasDrop && hasLaku) {
                                if (t.laku === t.drop) dropNote = ' · semua terjual hari ini';
                                else if (t.laku < t.drop) dropNote = ' · sisa '+(t.drop-t.laku)+' di toko';
                                else dropNote = ' · ada laku dari stok sebelumnya';
                              }
                              return (
                                <div key={t.id} className="detail-row toko-detail-row">
                                  <div className="toko-info">
                                    <div className="toko-main">
                                      {t.emoji} {t.name}
                                      {hasLaku && <> · <strong>{t.laku}</strong> laku × {IDR(V2K.gaji)}</>}
                                      {!hasLaku && hasDrop && <span style={{color:"var(--text3)"}}> · drop saja, belum laku</span>}
                                    </div>
                                    {hasDrop && <div className="toko-sub">📦 Drop {t.drop} voucher ke toko{dropNote}</div>}
                                  </div>
                                  <span className="detail-item-value">{hasLaku ? IDR(t.laku*V2K.gaji) : <span style={{color:"var(--text3)"}}>—</span>}</span>
                                </div>
                              );
                            })}
                          </>}
                          {expItems.length>0 && <>
                            <div className="detail-section-label red">Rincian Pengeluaran</div>
                            {expItems.map((x,xi)=>(<div key={xi} className="detail-row"><span className="detail-item-name">{x.desc||'Pengeluaran'}</span><span style={{color:"var(--red)",fontWeight:600}}>−{IDR(x.amount)}</span></div>))}
                          </>}
                          {cashItems.length>0 && <>
                            <div className="detail-section-label green">💵 Hutang Dibayar</div>
                            {cashItems.map((x,xi)=>(<div key={xi} className="detail-row"><span className="detail-item-name">{x.desc||'Hutang Dibayar'}</span><span style={{color:"var(--green)",fontWeight:600}}>+{IDR(x.amount)}</span></div>))}
                          </>}
                          <button className="btn btn-danger" style={{width:"100%",marginTop:14,padding:"10px"}} onClick={(ev)=>{ev.stopPropagation();deleteEntry(e.date);}}><Icon type="trash" size={14}/> Hapus Data Ini</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </>}
            </div>
          </div>

          <div className="mobile-nav"><div className="mobile-nav-inner">
            <button className={"mobile-nav-btn "+(page==="input"?"active":"")} onClick={()=>setPage("input")}><Icon type="coffee" size={20}/> Input</button>
            <button className={"mobile-nav-btn "+(page==="voucher"?"active":"")} onClick={()=>setPage("voucher")}><span style={{fontSize:18}}>📶</span> Voucher</button>
            <button className={"mobile-nav-btn "+(page==="gajian"?"active":"")} onClick={()=>setPage("gajian")}><Icon type="dollar" size={20}/> Gajian</button>
            <button className={"mobile-nav-btn "+(page==="riwayat"?"active":"")} onClick={()=>setPage("riwayat")}><Icon type="clock" size={20}/> Riwayat</button>
          </div></div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
