# Build Vite lalu deploy hasilnya ke GitHub Pages.
#
# Sebelum ini index.html di root repo langsung jadi halaman yang disajikan,
# jadi `git push` = live. Setelah ada build step, yang harus disajikan adalah
# isi dist/, bukan isi repo. Workflow ini yang menjembatani supaya alurnya
# tetap sama: push ke main -> live.
#
# CNAME ikut tersalin sendiri karena file-nya ada di public/ (lihat Fase 1),
# dan Vite menyalin seluruh isi public/ ke dist/. Tanpa itu custom domain
# lepas tiap deploy.

name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  # Bisa dijalankan manual dari branch mana pun — dipakai untuk mencoba deploy
  # dari branch refactor dulu sebelum main disentuh.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy tidak boleh saling tindih. Yang sedang jalan dibiarkan selesai supaya
# situs tidak sempat tersaji setengah jadi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm

      # npm ci, bukan npm install: ci menolak kalau package-lock.json tidak
      # cocok dengan package.json, dan memasang persis versi yang terkunci.
      # Itu yang membuat build di sini sama dengan build di laptop.
      - run: npm ci

      # Tes jalan SEBELUM build: kalau rumus uang salah, jangan sampai
      # hasilnya sempat ter-deploy.
      - run: npm test

      - run: npm run build

      - name: Pastikan CNAME ikut ke dist/
        run: |
          test -f dist/CNAME || { echo "dist/CNAME hilang — custom domain akan lepas"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"

      # Berkas titik gampang hilang tanpa suara (Vite, Jekyll, rsync — semua
      # punya kebiasaan melewatinya), dan hilangnya tidak terlihat dari mana
      # pun kecuali address bar yang tiba-tiba muncul di app Android.
      - name: Pastikan assetlinks.json & manifest ikut ke dist/
        run: |
          test -f dist/.well-known/assetlinks.json || { echo "dist/.well-known/assetlinks.json hilang — app Android akan memunculkan address bar"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "dist/manifest.webmanifest hilang — app tidak bisa dipasang ke layar utama"; exit 1; }
          test -f dist/sw.js || { echo "dist/sw.js hilang — app tidak bisa dibuka tanpa sinyal"; exit 1; }

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
