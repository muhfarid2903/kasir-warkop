# Build Vite lalu deploy hasilnya ke GitHub Pages.
#
# Sebelum ini index.html di root repo langsung jadi halaman yang disajikan,
# jadi `git push` = live. Setelah ada build step, yang harus disajikan adalah
# isi dist/, bukan isi repo. Workflow ini yang menjembatani supaya alurnya
# tetap sama: push ke main -> live.
#
# CNAME ikut tersalin sendiri karena file-nya ada di public/ (lihat Fase 1),
# dan Vite menyalin seluruh isi public/ ke dist/. Tanpa itu custom domain
# lepas tiap deploy.

name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  # Bisa dijalankan manual dari branch mana pun — dipakai untuk mencoba deploy
  # dari branch refactor dulu sebelum main disentuh.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy tidak boleh saling tindih. Yang sedang jalan dibiarkan selesai supaya
# situs tidak sempat tersaji setengah jadi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm

      # npm ci, bukan npm install: ci menolak kalau package-lock.json tidak
      # cocok dengan package.json, dan memasang persis versi yang terkunci.
      # Itu yang membuat build di sini sama dengan build di laptop.
      - run: npm ci

      - run: npm run lint

      # Tes jalan SEBELUM build: kalau rumus uang salah, jangan sampai
      # hasilnya sempat ter-deploy.
      - run: npm test

      # Uji asap di browser sungguhan, di atas database tiruan (tidak
      # menyentuh Supabase): masuk → simpan → Riwayat → edit → hapus. Kalau
      # alur utama kasir patah, deploy berhenti di sini.
      - run: npx playwright install --with-deps chromium
      - run: npm run uji:asap

      - run: npm run build

      # Build tiruan (VITE_DB=tiruan) tidak boleh sampai ke kasir: isinya data
      # karangan dan tidak tersambung ke Supabase sama sekali.
      - name: Pastikan yang ter-build database asli, bukan tiruan
        run: |
          if grep -lq "tiruan-pemilik" dist/assets/*.js; then echo "dist/ berisi database tiruan — batal deploy"; exit 1; fi
          grep -lq "supabase.co" dist/assets/*.js || { echo "dist/ tidak memuat alamat Supabase — cek berkas .env"; exit 1; }

      - name: Pastikan CNAME ikut ke dist/
        run: |
          test -f dist/CNAME || { echo "dist/CNAME hilang — custom domain akan lepas"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"

      - name: Pastikan berkas app ada di dist/
        run: |
          test -f dist/manifest.webmanifest || { echo "dist/manifest.webmanifest hilang — app tidak bisa dipasang ke layar utama"; exit 1; }
          test -f dist/sw.js || { echo "dist/sw.js hilang — app tidak bisa dibuka tanpa sinyal"; exit 1; }

      - uses: actions/configure-pages@v6.0.0

      # Dibungkus sendiri, bukan pakai actions/upload-pages-artifact: action
      # itu membungkus dengan `--exclude=.[^/]*`, yang membuang SELURUH berkas
      # & folder titik. Dulu itu menghilangkan .well-known/assetlinks.json milik
      # app Android; app Android sudah dihentikan (cukup PWA), tapi cara ini
      # dipertahankan supaya berkas titik yang kelak ditambahkan tidak hilang
      # diam-diam dengan cara yang sama.
      #
      # Bentuk artefaknya sama persis dengan yang dibuat action itu: satu
      # berkas artifact.tar berisi isi dist/, diunggah dengan nama
      # "github-pages" — yang memang dicari actions/deploy-pages.
      - name: Bungkus dist/ (termasuk berkas titik)
        run: |
          tar --dereference --hard-dereference \
              --directory dist \
              -cf "$RUNNER_TEMP/artifact.tar" \
              --exclude=.git \
              --exclude=.github \
              .

      # Yang diperiksa isi bungkusannya, bukan isi dist/: berkas yang ada di
      # dist tapi tidak ikut terbungkus tidak akan pernah sampai ke server.
      - name: Pastikan berkas penting ikut terbungkus
        run: |
          for f in manifest.webmanifest sw.js CNAME index.html; do
            tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qE "(^|/)$f$" || { echo "$f tidak ikut terbungkus"; exit 1; }
          done
          echo "isi bungkusan:"; tar -tf "$RUNNER_TEMP/artifact.tar" | grep -E "manifest|sw.js|CNAME"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
